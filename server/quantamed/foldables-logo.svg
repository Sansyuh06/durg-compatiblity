<svg width="200" height="280" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Top blue folded panel -->
  <g transform="translate(50, 20)">
    <path d="M 0 0 L 100 0 L 120 40 L 20 40 Z" fill="#A8C5E8" stroke="#2C3E50" stroke-width="3"/>
    <!-- Diagonal lines for texture -->
    <line x1="10" y1="5" x2="110" y2="5" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="15" y1="12" x2="115" y2="12" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="19" x2="120" y2="19" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="10" y1="26" x2="110" y2="26" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="15" y1="33" x2="115" y2="33" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Middle yellow folded panel -->
  <g transform="translate(40, 80)">
    <path d="M 20 0 L 120 0 L 100 30 L 0 30 Z" fill="#F5E6A8" stroke="#2C3E50" stroke-width="3"/>
    <!-- Diagonal lines for texture -->
    <line x1="25" y1="5" x2="115" y2="5" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="12" x2="110" y2="12" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="15" y1="19" x2="105" y2="19" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="10" y1="26" x2="100" y2="26" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Bottom green folded panel -->
  <g transform="translate(60, 130)">
    <path d="M 0 0 L 100 0 L 80 50 L -20 50 Z" fill="#B8E6B8" stroke="#2C3E50" stroke-width="3"/>
    <!-- Diagonal lines for texture -->
    <line x1="5" y1="8" x2="95" y2="8" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="16" x2="90" y2="16" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="5" y1="24" x2="85" y2="24" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="32" x2="80" y2="32" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="-5" y1="40" x2="75" y2="40" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Text: Foldables -->
  <text x="100" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="600" text-anchor="middle" fill="#2C3E50" letter-spacing="2">
    Foldables
  </text>
</svg>

